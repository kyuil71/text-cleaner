<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data: blob:; style-src 'unsafe-inline'; script-src 'unsafe-inline'; font-src data:; connect-src blob:; media-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>오프라인 텍스트 클리너</title>
  <style>
    :root{--blue:#2563eb;--blue2:#1d4ed8;--ink:#172033;--muted:#64748b;--line:#dbe3ee;--soft:#f6f8fc;--ok:#15803d;--warn:#b45309;--danger:#b91c1c;--radius:18px}
    *{box-sizing:border-box}
    html{font-size:16px}
    body{margin:0;min-height:100vh;padding:32px 16px;background:#eef2f7;color:var(--ink);font-family:Pretendard,"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;line-height:1.55}
    button,input{font:inherit}
    button{cursor:pointer}
    button:disabled{cursor:wait;opacity:.62}
    :focus-visible{outline:3px solid #93c5fd;outline-offset:2px}
    .app{width:min(860px,100%);margin:auto}
    .card{background:#fff;border:1px solid #e6ebf2;border-radius:28px;padding:clamp(20px,4vw,38px);box-shadow:0 18px 45px rgba(15,23,42,.08)}
    header{text-align:center;margin-bottom:26px}
    .icon{display:grid;place-items:center;width:58px;height:58px;margin:0 auto 12px;border-radius:17px;background:#eaf2ff;color:var(--blue);font-size:28px;font-weight:800}
    h1{margin:0;font-size:clamp(1.55rem,4vw,2rem);letter-spacing:-.035em}
    header p{margin:8px auto 0;max-width:620px;color:var(--muted)}
    .privacy{display:inline-flex;align-items:center;gap:7px;margin-top:12px;padding:6px 11px;border-radius:999px;background:#ecfdf3;color:#166534;font-size:.9rem;font-weight:700}
    .privacy::before{content:"";width:8px;height:8px;border-radius:50%;background:#22c55e}
    .section{margin-top:22px}
    .row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 2px 8px}
    .label{font-weight:750}
    .toolbar{display:flex;gap:4px;padding:4px;border:1px solid var(--line);border-radius:12px;background:var(--soft)}
    .tool{width:36px;height:34px;border:0;border-radius:8px;background:transparent;color:#334155;font-weight:800}
    .tool:hover{background:#e5eaf1}
    .editor{width:100%;min-height:210px;max-height:430px;overflow:auto;padding:16px;border:1px solid var(--line);border-radius:var(--radius);background:#fbfcfe;color:#263247;line-height:1.5;overflow-wrap:anywhere}
    .editor:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(37,99,235,.12);outline:0}
    .editor:empty::before{content:attr(data-placeholder);color:#94a3b8;pointer-events:none}
    .editor img{max-width:100%;height:auto;vertical-align:middle}
    .editor p,.editor div,.editor h1,.editor h2,.editor h3,.editor h4,.editor h5,.editor h6{margin:.25em 0}
    .options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:12px}
    .option{display:flex;align-items:flex-start;gap:10px;min-height:62px;padding:12px;border:1px solid var(--line);border-radius:14px;background:#fff}
    .option:hover{background:#f8fafc}
    .option input{width:19px;height:19px;margin:2px 0 0;accent-color:var(--blue);flex:0 0 auto}
    .option b{display:block;font-size:.98rem}
    .option small{display:block;color:var(--muted);font-size:.84rem;line-height:1.35;margin-top:2px}
    .actions{display:grid;grid-template-columns:1fr 2fr;gap:10px;margin-top:18px}
    .btn{min-height:49px;border:0;border-radius:13px;padding:12px 16px;font-weight:750;transition:.15s transform,.15s background}
    .btn:active{transform:scale(.985)}
    .primary{background:var(--blue);color:#fff;box-shadow:0 8px 18px rgba(37,99,235,.18)}
    .primary:hover{background:var(--blue2)}
    .secondary{background:#edf1f6;color:#334155}
    .secondary:hover{background:#e2e8f0}
    .dark{background:#1e293b;color:#fff}
    .dark:hover{background:#0f172a}
    .outline{background:#fff;border:1px solid var(--line);color:#334155}
    .outline:hover{background:#f8fafc}
    .result{display:none;margin-top:26px;padding-top:24px;border-top:1px solid #e8edf3}
    .result.show{display:block}
    .output{background:#f5f8ff;border-color:#cfe0ff}
    .stats{display:flex;flex-wrap:wrap;gap:7px;margin:10px 0 0;padding:0;list-style:none}
    .stats li{padding:5px 9px;border-radius:999px;background:#eef2f7;color:#475569;font-size:.86rem}
    .stats .success{background:#ecfdf3;color:var(--ok)}
    .stats .warning{background:#fff7ed;color:var(--warn)}
    .exports{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
    .notice{margin-top:12px;padding:11px 13px;border-radius:12px;background:#fff7ed;color:#8a480d;font-size:.9rem}
    .notice:empty{display:none}
    footer{text-align:center;color:var(--muted);font-size:.9rem;margin:18px 0 0}
    .toast{position:fixed;left:50%;bottom:24px;z-index:20;transform:translate(-50%,20px);max-width:min(620px,calc(100% - 30px));padding:12px 18px;border-radius:14px;background:rgba(15,23,42,.95);color:#fff;opacity:0;pointer-events:none;transition:.2s;box-shadow:0 12px 30px rgba(0,0,0,.22);text-align:center}
    .toast.show{opacity:1;transform:translate(-50%,0)}
    .spinner{display:inline-block;width:17px;height:17px;margin-right:8px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;vertical-align:-3px;animation:spin .75s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    @media(max-width:650px){body{padding:14px 10px}.card{border-radius:22px}.options,.exports{grid-template-columns:1fr}.actions{grid-template-columns:1fr}.editor{min-height:190px}.row{align-items:flex-end}.privacy{font-size:.82rem}}
    @media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;animation:none!important;transition:none!important}}
    @media print{body{background:#fff;padding:0}.card{border:0;box-shadow:none;padding:0}header,.section.input-section,.actions,.exports,.stats,.notice,footer{display:none!important}.result{display:block!important;border:0;margin:0;padding:0}.output{border:0;max-height:none;background:#fff;padding:0}}
  </style>
</head>
<body>
  <main class="app">
    <article class="card">
      <header>
        <div class="icon" aria-hidden="true">T</div>
        <h1>오프라인 텍스트 클리너</h1>
        <p>텍스트·기본 서식·붙여넣은 이미지를 기기 안에서 정리합니다.</p>
        <span class="privacy">외부 서버 전송 없음 · 인터넷 불필요</span>
      </header>

      <section class="section input-section" aria-labelledby="inputLabel">
        <div class="row">
          <span id="inputLabel" class="label">내용 입력</span>
          <div class="toolbar" aria-label="텍스트 서식">
            <button class="tool" type="button" data-command="bold" aria-label="굵게" title="굵게">B</button>
            <button class="tool" type="button" data-command="italic" aria-label="기울임" title="기울임"><i>I</i></button>
            <button class="tool" type="button" data-command="underline" aria-label="밑줄" title="밑줄"><u>U</u></button>
          </div>
        </div>
        <div id="inputBox" class="editor" contenteditable="true" role="textbox" aria-labelledby="inputLabel" aria-multiline="true" spellcheck="true" data-placeholder="변환할 문장을 입력하거나 붙여넣으세요. 클립보드의 이미지도 함께 붙여넣을 수 있습니다."></div>

        <div class="options" aria-label="정제 옵션">
          <label class="option"><input id="removeEmoji" type="checkbox" checked><span><b>이모지 삭제</b><small>일반 문장부호와 한글은 유지합니다.</small></span></label>
          <label class="option"><input id="cleanMarkdown" type="checkbox" checked><span><b>Markdown 기호 정리</b><small>제목·강조 용도의 #, *만 문맥에 따라 제거합니다.</small></span></label>
          <label class="option"><input id="removeBlank" type="checkbox" checked><span><b>빈 줄 삭제</b><small>내용 없는 문단과 연속 빈 줄을 제거합니다.</small></span></label>
          <label class="option"><input id="mergeWraps" type="checkbox" checked><span><b>잘린 문장 연결</b><small>문장 중간에서 잘린 긴 줄을 보수적으로 연결합니다.</small></span></label>
          <label class="option"><input id="addPeriods" type="checkbox"><span><b>문장 마침표 보정</b><small>제목·목록·URL을 제외한 문장에만 적용합니다.</small></span></label>
          <label class="option"><input id="keepImages" type="checkbox" checked><span><b>이미지 포함</b><small>클립보드 이미지 데이터를 결과에 내장합니다.</small></span></label>
        </div>

        <div class="actions">
          <button id="clearBtn" class="btn secondary" type="button">전체 지우기</button>
          <button id="processBtn" class="btn primary" type="button">텍스트 정제하기</button>
        </div>
      </section>

      <section id="resultArea" class="result" aria-labelledby="resultLabel">
        <div class="row"><span id="resultLabel" class="label">정제된 결과</span><span id="charCount" aria-live="polite">0자</span></div>
        <div id="outputBox" class="editor output" contenteditable="true" role="textbox" aria-labelledby="resultLabel" aria-multiline="true"></div>
        <ul id="stats" class="stats" aria-label="정제 결과 통계"></ul>
        <div id="notice" class="notice" role="status"></div>
        <div class="exports">
          <button id="copyFormattedBtn" class="btn dark" type="button">서식·이미지 복사</button>
          <button id="copyTextBtn" class="btn secondary" type="button">텍스트만 복사</button>
          <button id="saveBtn" class="btn outline" type="button">결과 HTML 저장</button>
        </div>
      </section>
    </article>
    <footer>모든 정제 과정은 현재 브라우저 안에서만 수행됩니다.</footer>
  </main>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script>
  (() => {
    'use strict';
    const $ = id => document.getElementById(id);
    const input = $('inputBox'), output = $('outputBox'), result = $('resultArea');
    const MAX_IMAGE_BYTES = 10 * 1024 * 1024;
    const MAX_TOTAL_IMAGE_BYTES = 30 * 1024 * 1024;
    const BLOCKS = new Set(['P','DIV','H1','H2','H3','H4','H5','H6','UL','OL','LI','BLOCKQUOTE','PRE','TABLE','THEAD','TBODY','TFOOT','TR','TD','TH']);
    const ALLOWED = new Set(['P','DIV','BR','SPAN','STRONG','B','EM','I','U','S','SUB','SUP','H1','H2','H3','H4','H5','H6','UL','OL','LI','BLOCKQUOTE','PRE','CODE','TABLE','THEAD','TBODY','TFOOT','TR','TD','TH','IMG','A']);
    const SAFE_STYLES = new Set(['font-weight','font-style','text-decoration','text-align','color','background-color','width','height']);
    let toastTimer;

    function toast(message){const el=$('toast');el.textContent=message;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),3200)}
    function setBusy(busy){const b=$('processBtn');b.disabled=busy;b.innerHTML=busy?'<span class="spinner"></span>처리 중…':'텍스트 정제하기'}
    function fileToDataURL(file){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=()=>reject(r.error||new Error('이미지를 읽지 못했습니다.'));r.readAsDataURL(file)})}
    function insertHtmlAtCursor(html){input.focus();const sel=getSelection();if(!sel||!sel.rangeCount){input.insertAdjacentHTML('beforeend',html);return}const range=sel.getRangeAt(0);range.deleteContents();const fragment=range.createContextualFragment(html);const last=fragment.lastChild;range.insertNode(fragment);if(last){range.setStartAfter(last);range.collapse(true);sel.removeAllRanges();sel.addRange(range)}}
    function escapeHtml(text){const d=document.createElement('div');d.textContent=text;return d.innerHTML}

    async function onPaste(event){
      const cd=event.clipboardData;if(!cd)return;
      event.preventDefault();
      const files=[...cd.items].filter(x=>x.kind==='file'&&x.type.startsWith('image/')).map(x=>x.getAsFile()).filter(Boolean);
      if(files.length){
        let html='';let total=0;
        for(const file of files){
          total+=file.size;
          if(file.size>MAX_IMAGE_BYTES||total>MAX_TOTAL_IMAGE_BYTES){toast('이미지가 너무 큽니다. 이미지당 10MB, 전체 30MB 이하로 사용해 주세요.');continue}
          try{html+='<img src="'+await fileToDataURL(file)+'" alt="붙여넣은 이미지">'}catch(_){toast('일부 이미지를 읽지 못했습니다.')}
        }
        if(html)insertHtmlAtCursor(html);
        const text=cd.getData('text/plain');if(text&&files.length===1&&cd.items.length>1)insertHtmlAtCursor('<div>'+escapeHtml(text).replace(/\r?\n/g,'<br>')+'</div>');
        return;
      }
      const html=cd.getData('text/html');
      if(html){const holder=document.createElement('div');holder.innerHTML=html;const report={removedUnsafe:0,externalImages:0};const safe=sanitize(holder,report,true);insertHtmlAtCursor(safe.innerHTML);if(report.externalImages)toast('웹 주소 이미지는 오프라인 보존이 어려워 제외했습니다. 이미지 자체를 복사해 붙여넣어 주세요.');return}
      insertHtmlAtCursor(escapeHtml(cd.getData('text/plain')).replace(/\r?\n/g,'<br>'));
    }

    function cleanStyle(styleText){
      const probe=document.createElement('span');probe.setAttribute('style',styleText||'');const kept=[];
      for(const name of SAFE_STYLES){const value=probe.style.getPropertyValue(name);if(value&&!/url\s*\(|expression\s*\(|javascript:/i.test(value))kept.push(name+':'+value)}
      return kept.join(';');
    }

    function sanitize(source,report,keepImages){
      const target=document.createElement('div');
      function visit(node,parent){
        if(node.nodeType===Node.TEXT_NODE){parent.appendChild(document.createTextNode(node.nodeValue));return}
        if(node.nodeType!==Node.ELEMENT_NODE)return;
        const tag=node.tagName.toUpperCase();
        if(!ALLOWED.has(tag)){report.removedUnsafe++;[...node.childNodes].forEach(n=>visit(n,parent));return}
        if(tag==='IMG'){
          if(!keepImages)return;
          const src=(node.getAttribute('src')||'').trim();
          if(!/^data:image\/(png|jpeg|jpg|gif|webp);base64,/i.test(src)&&!/^blob:/i.test(src)){report.externalImages++;return}
          const img=document.createElement('img');img.src=src;img.alt=(node.getAttribute('alt')||'이미지').slice(0,200);img.loading='eager';
          const w=parseFloat(node.getAttribute('width')||node.style.width);const h=parseFloat(node.getAttribute('height')||node.style.height);
          if(Number.isFinite(w)&&w>0)img.width=Math.min(Math.round(w),2400);if(Number.isFinite(h)&&h>0)img.height=Math.min(Math.round(h),2400);
          parent.appendChild(img);return;
        }
        const el=document.createElement(tag.toLowerCase());
        const style=cleanStyle(node.getAttribute('style'));if(style)el.setAttribute('style',style);
        if(tag==='A'){
          const href=(node.getAttribute('href')||'').trim();
          if(/^(https?:|mailto:|tel:)/i.test(href)){el.href=href;el.rel='noopener noreferrer'}
        }
        if(['TD','TH'].includes(tag))for(const a of ['colspan','rowspan']){const v=parseInt(node.getAttribute(a),10);if(v>1&&v<100)el.setAttribute(a,String(v))}
        [...node.childNodes].forEach(n=>visit(n,el));parent.appendChild(el);
      }
      [...source.childNodes].forEach(n=>visit(n,target));return target;
    }

    function removeEmoji(text){
      try{return text.replace(/[\u{1F1E6}-\u{1F1FF}]{2}|[#*0-9]\uFE0F?\u20E3|\p{Extended_Pictographic}(?:\uFE0F|\p{Emoji_Modifier})?(?:\u200D\p{Extended_Pictographic}(?:\uFE0F|\p{Emoji_Modifier})?)*/gu,'')}
      catch(_){return text.replace(/[\uD83C-\uDBFF][\uDC00-\uDFFF]|[\u2600-\u27BF]/g,'')}
    }
    function cleanMarkdownText(text){
      return text.replace(/^(\s{0,3})#{1,6}[ \t]+/gm,'$1').replace(/\*\*([^*\n]+)\*\*/g,'$1').replace(/__([^_\n]+)__/g,'$1').replace(/(^|[^\w])\*([^*\n]+)\*(?!\w)/g,'$1$2').replace(/^(\s*)\*[ \t]+/gm,'$1• ');
    }
    function walkText(root,fn){const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);const nodes=[];while(walker.nextNode())nodes.push(walker.currentNode);nodes.forEach(n=>{n.nodeValue=fn(n.nodeValue)})}
    function visibleText(el){return (el.textContent||'').replace(/[\s\u00a0\u200B\uFEFF]/g,'')}
    function isEmpty(el){return !visibleText(el)&&!el.querySelector('img')}
    function removeEmpty(root){[...root.querySelectorAll('*')].reverse().forEach(el=>{if(BLOCKS.has(el.tagName)&&isEmpty(el))el.remove()})}
    function trimTrailingBreaks(root){root.querySelectorAll('p,div,li,blockquote').forEach(el=>{while(el.lastChild&&((el.lastChild.nodeType===1&&el.lastChild.tagName==='BR')||(el.lastChild.nodeType===3&&!el.lastChild.nodeValue.trim())))el.lastChild.remove()})}
    function shouldMerge(a,b){
      if(!a||!b||!['DIV','P'].includes(a.tagName)||!['DIV','P'].includes(b.tagName))return false;
      if(a.querySelector('img,table,ul,ol,pre,blockquote')||b.querySelector('img,table,ul,ol,pre,blockquote'))return false;
      const at=a.textContent.trim(),bt=b.textContent.trim();if(at.length<12||!bt)return false;
      if(/[.!?。？！…:;]$/.test(at)||/^[•·\-–—▶▷▪■□※]|^\d+[.)]\s/.test(bt))return false;
      return true;
    }
    function mergeWrappedBlocks(root,report){let n=root.firstElementChild;while(n){const next=n.nextElementSibling;if(next&&shouldMerge(n,next)){n.appendChild(document.createTextNode(' '));while(next.firstChild)n.appendChild(next.firstChild);next.remove();report.merged++;continue}n=next}}
    function looksLikeSentence(el){
      if(!['P','DIV','BLOCKQUOTE'].includes(el.tagName)||el.closest('li,th,td,pre')||el.querySelector('img'))return false;
      const t=el.textContent.trim();if(t.length<8||/[.!?。？！…]$/.test(t)||/(https?:\/\/|www\.|\S+@\S+)\S*$/.test(t))return false;return /[가-힣A-Za-z0-9]$/.test(t);
    }
    function addPeriods(root,report){root.querySelectorAll('p,div,blockquote').forEach(el=>{if(looksLikeSentence(el)){const walker=document.createTreeWalker(el,NodeFilter.SHOW_TEXT);let last;while(walker.nextNode())if(walker.currentNode.nodeValue.trim())last=walker.currentNode;if(last){last.nodeValue=last.nodeValue.replace(/\s+$/,'')+'.';report.periods++}}})}
    function graphemeLength(text){try{return [...new Intl.Segmenter('ko',{granularity:'grapheme'}).segment(text)].length}catch(_){return [...text].length}}
    function plainText(el){return (el.innerText||el.textContent||'').replace(/[\u200B\uFEFF]/g,'').replace(/\u00a0/g,' ').split(/\r?\n/).map(x=>x.replace(/[ \t]+$/,'')).filter((x,i,a)=>x.trim()||i&&a[i-1].trim()).join('\r\n').trim()}
    async function blobImagesToData(root,report){
      const imgs=[...root.querySelectorAll('img[src^="blob:"]')];let total=0;
      for(const img of imgs){try{const response=await fetch(img.src);const blob=await response.blob();total+=blob.size;if(blob.size>MAX_IMAGE_BYTES||total>MAX_TOTAL_IMAGE_BYTES)throw new Error('size');img.src=await fileToDataURL(blob);report.images++}catch(_){img.remove();report.externalImages++;}}
      report.images=root.querySelectorAll('img[src^="data:image/"]').length;
    }

    async function process(){
      if(!visibleText(input)&&!input.querySelector('img')){toast('정제할 내용을 먼저 입력해 주세요.');input.focus();return}
      setBusy(true);
      try{
        const report={removedUnsafe:0,externalImages:0,images:0,merged:0,periods:0};
        const safe=sanitize(input,report,$('keepImages').checked);
        await blobImagesToData(safe,report);
        walkText(safe,text=>{let x=text;if($('removeEmoji').checked)x=removeEmoji(x);if($('cleanMarkdown').checked)x=cleanMarkdownText(x);return x.replace(/[ \t]{2,}/g,' ')});
        trimTrailingBreaks(safe);if($('removeBlank').checked)removeEmpty(safe);if($('mergeWraps').checked)mergeWrappedBlocks(safe,report);if($('addPeriods').checked)addPeriods(safe,report);
        output.innerHTML=safe.innerHTML;
        $('charCount').textContent=graphemeLength(output.textContent)+'자';
        const stats=[['문장 연결 '+report.merged+'건',''],['마침표 보정 '+report.periods+'건',''],['내장 이미지 '+report.images+'개','success']];
        if(report.removedUnsafe)stats.push(['위험 요소 제거 '+report.removedUnsafe+'건','warning']);if(report.externalImages)stats.push(['제외 이미지 '+report.externalImages+'개','warning']);
        $('stats').innerHTML=stats.map(x=>'<li class="'+x[1]+'">'+x[0]+'</li>').join('');
        $('notice').textContent=report.externalImages?'외부 주소 또는 너무 큰 이미지는 제외했습니다. 이미지 파일 자체를 복사하거나 저장된 파일을 붙여넣어 주세요.':'';
        result.classList.add('show');result.scrollIntoView({behavior:'smooth',block:'start'});
      }catch(err){console.error(err);toast('처리 중 오류가 발생했습니다. 입력 내용을 줄여 다시 시도해 주세요.')}finally{setBusy(false)}
    }

    function compatibleHtml(){
      const report={removedUnsafe:0,externalImages:0};const safe=sanitize(output,report,true);
      safe.querySelectorAll('h1,h2,h3,h4,h5,h6').forEach(h=>{const d=document.createElement('div'),s=document.createElement('strong');s.innerHTML=h.innerHTML;d.appendChild(s);h.replaceWith(d)});
      safe.querySelectorAll('*').forEach(el=>{el.style.fontSize='';el.style.lineHeight=''});
      return '<!doctype html><html><head><meta charset="utf-8"><title>정제된 텍스트</title></head><body>'+safe.innerHTML+'</body></html>';
    }
    async function copyFormatted(){
      if(!visibleText(output)&&!output.querySelector('img'))return;
      const html=compatibleHtml(),text=plainText(output);let copied=false;
      if(navigator.clipboard&&window.ClipboardItem){try{await navigator.clipboard.write([new ClipboardItem({'text/html':new Blob([html],{type:'text/html'}),'text/plain':new Blob([text],{type:'text/plain'})})]);copied=true}catch(_){}}
      if(!copied){const listener=e=>{e.clipboardData.setData('text/html',html);e.clipboardData.setData('text/plain',text);e.preventDefault()};document.addEventListener('copy',listener);try{copied=document.execCommand('copy')}finally{document.removeEventListener('copy',listener)}}
      toast(copied?'서식과 이미지가 포함된 결과를 복사했습니다.':'브라우저가 복사를 차단했습니다. 결과를 선택해 직접 복사해 주세요.');
    }
    async function copyText(){const text=plainText(output);if(!text)return;let copied=false;if(navigator.clipboard?.writeText)try{await navigator.clipboard.writeText(text);copied=true}catch(_){}if(!copied){const ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();copied=document.execCommand('copy');ta.remove()}toast(copied?'텍스트만 복사했습니다.':'복사가 차단되었습니다.')}
    function saveHtml(){
      if(!visibleText(output)&&!output.querySelector('img'))return;
      const css='body{max-width:900px;margin:40px auto;padding:0 20px;font:16px/1.6 "Malgun Gothic",system-ui,sans-serif;color:#172033}img{max-width:100%;height:auto}table{border-collapse:collapse}td,th{border:1px solid #cbd5e1;padding:6px 9px}';
      const html='<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>정제된 텍스트</title><style>'+css+'</style></head><body>'+output.innerHTML+'</body></html>';
      const url=URL.createObjectURL(new Blob([html],{type:'text/html;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='cleaned-text.html';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('인터넷 없이 열 수 있는 HTML 파일로 저장했습니다.');
    }

    input.addEventListener('paste',onPaste);
    document.querySelectorAll('[data-command]').forEach(b=>b.addEventListener('click',()=>{input.focus();document.execCommand(b.dataset.command,false,null)}));
    $('processBtn').addEventListener('click',process);
    $('clearBtn').addEventListener('click',()=>{input.innerHTML='';output.innerHTML='';result.classList.remove('show');$('notice').textContent='';input.focus()});
    $('copyFormattedBtn').addEventListener('click',copyFormatted);$('copyTextBtn').addEventListener('click',copyText);$('saveBtn').addEventListener('click',saveHtml);
  })();
  </script>
</body>
</html>
